<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Script Home-Work 11</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <form class="form">
      <label>
        <input
          type="text"
          name="search-text"
          placeholder="Search images..."
          required
        />
      </label>
      <button type="submit">Search</button>
    </form>
    <div class="gallery-section">
      <ul class="gallery"></ul>
      <button class="load-more-btn js-load-btn is-hidden" type="button">
        Load more
      </button>
      <div class="gallery-loader is-hidden" id="gallery-loader"></div>
    </div>
    <script src="./main.js" type="module"></script>
  </body>
</html>
